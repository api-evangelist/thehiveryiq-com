- target: $.paths['/v1/attest/passport/issue'].post
  update:
    x-apievangelist-phrasing:
      intent: Issue a pre-action attestation passport
      effect: write
      questions:
      - How do I get a signed passport declaring what my agent intends to do before it acts?
      - Can a pre-action attestation manifest expire after a set number of seconds?
      - What do I need to supply to issue a hive-passport for an agent action?
      instructions:
      - text: Issue a pre-action passport for agent {agent_did} to run {intended_op} on {target_resource} as action {action_id}.
        slots:
          agent_did: requestBody.agent_did
          intended_op: requestBody.intended_op
          target_resource: requestBody.target_resource
          action_id: requestBody.action_id
      - text: Create a passport manifest for action {action_id} by {agent_did} doing {intended_op} on {target_resource}, valid for {ttl_seconds} seconds.
        slots:
          action_id: requestBody.action_id
          agent_did: requestBody.agent_did
          intended_op: requestBody.intended_op
          target_resource: requestBody.target_resource
          ttl_seconds: requestBody.ttl_seconds
      method: generated
      generated: '2026-09-26'
