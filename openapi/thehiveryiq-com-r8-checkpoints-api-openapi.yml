openapi: 3.2.0
info:
  title: HiveMorph v0.1 R8 Checkpoints API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: r8-checkpoints
paths:
  /v1/checkpoint/policy:
    get:
      tags:
      - r8-checkpoints
      summary: Checkpoint Policy
      operationId: checkpoint_policy_v1_checkpoint_policy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/checkpoint/write:
    post:
      tags:
      - r8-checkpoints
      summary: Checkpoint Write
      operationId: checkpoint_write_v1_checkpoint_write_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hivemorph__hive_r8__routes__WriteReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/checkpoint/list:
    get:
      tags:
      - r8-checkpoints
      summary: Checkpoint List
      operationId: checkpoint_list_v1_checkpoint_list_get
      parameters:
      - name: wid
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Wid
      - name: agent_did
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Agent Did
      - name: phase
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Phase
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/checkpoint/workflow/{wid}:
    get:
      tags:
      - r8-checkpoints
      summary: Checkpoint Workflow
      operationId: checkpoint_workflow_v1_checkpoint_workflow__wid__get
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Wid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/checkpoint/archive/{wid}:
    post:
      tags:
      - r8-checkpoints
      summary: Checkpoint Archive
      operationId: checkpoint_archive_v1_checkpoint_archive__wid__post
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Wid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/checkpoint/replay/{wid}:
    get:
      tags:
      - r8-checkpoints
      summary: Checkpoint Replay
      operationId: checkpoint_replay_v1_checkpoint_replay__wid__get
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Wid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/checkpoint/{cid}:
    get:
      tags:
      - r8-checkpoints
      summary: Checkpoint Get
      operationId: checkpoint_get_v1_checkpoint__cid__get
      parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Cid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    hivemorph__hive_r8__routes__WriteReq:
      properties:
        wid:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Wid
        phase:
          type: string
          maxLength: 40
          minLength: 1
          title: Phase
        agent_did:
          type: string
          maxLength: 200
          minLength: 3
          title: Agent Did
        operator_did:
          type: string
          maxLength: 200
          minLength: 3
          title: Operator Did
        state:
          additionalProperties: true
          type: object
          title: State
        rubric_hash:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Rubric Hash
        policy_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Policy Version
        delegation_jti:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Delegation Jti
        hktn_refs:
          items:
            type: string
          type: array
          maxItems: 64
          title: Hktn Refs
        receipt_refs:
          items:
            type: string
          type: array
          maxItems: 64
          title: Receipt Refs
        artifact_refs:
          items:
            type: string
          type: array
          maxItems: 64
          title: Artifact Refs
        note:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Note
      type: object
      required:
      - phase
      - agent_did
      - operator_did
      title: WriteReq
