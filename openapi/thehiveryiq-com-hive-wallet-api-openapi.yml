openapi: 3.2.0
info:
  title: HiveMorph v0.1 Hive Wallet API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: hive-wallet
paths:
  /v1/wallet/stats:
    get:
      tags:
      - hive-wallet
      summary: Wallet Stats
      description: Public counter — total Hive Wallets created.
      operationId: wallet_stats_v1_wallet_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Wallet Stats V1 Wallet Stats Get
  /v1/wallet/register:
    post:
      tags:
      - hive-wallet
      summary: Wallet Register
      description: 'Link the authenticated Privy session to a Hive Wallet row.


        Called by the frontend right after Privy creates the embedded wallet,

        so we can attribute referrals and start the XP counter.'
      operationId: wallet_register_v1_wallet_register_post
      parameters:
      - name: referrer
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Referrer
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Wallet Register V1 Wallet Register Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/wallet/me:
    get:
      tags:
      - hive-wallet
      summary: Wallet Me
      description: Return the authenticated wallet's state.
      operationId: wallet_me_v1_wallet_me_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Wallet Me V1 Wallet Me Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/wallet/me/mints:
    get:
      tags:
      - hive-wallet
      summary: Wallet Me Mints
      operationId: wallet_me_mints_v1_wallet_me_mints_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Wallet Me Mints V1 Wallet Me Mints Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
