      - affordances
      summary: Get Catalogs
      description: List the affordance catalog for every hot supermodel.
      operationId: get_catalogs_v1_affordance_catalog_get
      parameters:
      - name: include_cold
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Cold
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Catalogs V1 Affordance Catalog Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
