openapi: 3.2.0
info:
  title: HiveMorph v0.1 Yield Optimizer API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: yield-optimizer
paths:
  /v1/yield/optimize:
    get:
      tags:
      - yield-optimizer
      summary: Get Yield Optimize
      description: 'Analyze offer history and recommend per-shape price + volume settings

        to maximize $/day. Pairs with ROI engine''s price uplift.'
      operationId: get_yield_optimize_v1_yield_optimize_get
      parameters:
      - name: window_days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 1
          description: History window for analysis
          default: 7
          title: Window Days
        description: History window for analysis
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Yield Optimize V1 Yield Optimize Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
