  /v1/perp/basis/positions:
    get:
      tags:
      - basis-perp
      summary: List Positions Endpoint
      operationId: list_positions_endpoint_v1_perp_basis_positions_get
      parameters:
      - name: owner_did
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Did
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
