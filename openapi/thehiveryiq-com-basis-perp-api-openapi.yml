      summary: Increase Position Endpoint
      operationId: increase_position_endpoint_v1_perp_basis_increase_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncreaseBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Increase Position Endpoint V1 Perp Basis Increase Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/perp/basis/decrease:
    post:
      tags:
      - basis-perp
      summary: Decrease Position Endpoint
      operationId: decrease_position_endpoint_v1_perp_basis_decrease_post
      requestBody:
        content:
          application/json:
