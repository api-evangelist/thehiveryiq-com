      summary: Open Position
      operationId: open_position_v1_perp_basis_open_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Open Position V1 Perp Basis Open Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/perp/basis/close:
    post:
      tags:
