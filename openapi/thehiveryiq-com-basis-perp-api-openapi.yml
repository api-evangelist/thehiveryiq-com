          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Market State Endpoint V1 Perp Basis Market Get
  /v1/perp/basis/leaderboard:
    get:
      tags:
      - basis-perp
      summary: Leaderboard Endpoint
      operationId: leaderboard_endpoint_v1_perp_basis_leaderboard_get
      parameters:
      - name: top_n
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Top N
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
