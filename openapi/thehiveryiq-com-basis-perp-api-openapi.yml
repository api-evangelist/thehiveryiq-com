      summary: Health Endpoint
      operationId: health_endpoint_v1_perp_basis_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Endpoint V1 Perp Basis Health Get
components:
  schemas:
    CloseBody:
      properties:
        position_id:
          type: string
          title: Position Id
      type: object
      required:
      - position_id
      title: CloseBody
    LiquidateBody:
      properties:
        position_id:
          type: string
          title: Position Id
      type: object
      required:
      - position_id
      title: LiquidateBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    IncreaseBody:
      properties:
        position_id:
          type: string
          title: Position Id
        additional_size_usdc:
          type: number
          exclusiveMinimum: 0.0
          title: Additional Size Usdc
        additional_collateral:
          type: number
          exclusiveMinimum: 0.0
          title: Additional Collateral
      type: object
      required:
      - position_id
      - additional_size_usdc
      - additional_collateral
      title: IncreaseBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DecreaseBody:
      properties:
        position_id:
          type: string
          title: Position Id
        reduce_size_usdc:
          type: number
          exclusiveMinimum: 0.0
          title: Reduce Size Usdc
      type: object
      required:
      - position_id
      - reduce_size_usdc
      title: DecreaseBody
    OpenBody:
      properties:
        side:
          type: string
          title: Side
          description: long or short
        size_usdc:
          type: number
          exclusiveMinimum: 0.0
          title: Size Usdc
        collateral_asset:
          type: string
          title: Collateral Asset
          description: USDC or USDT
        collateral_amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Collateral Amount
          description: Collateral in collateral_asset units. Defaults to 25% of size_usdc.
        owner_did:
          type: string
          title: Owner Did
          default: did:hive:caller
        payout_address:
          type: string
          title: Payout Address
          default: ''
        rail_settlement_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Rail Settlement Id
      type: object
      required:
      - side
      - size_usdc
      - collateral_asset
      title: OpenBody
