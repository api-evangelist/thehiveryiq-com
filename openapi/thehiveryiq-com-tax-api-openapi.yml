openapi: 3.2.0
info:
  title: HiveMorph v0.1 Tax API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: Tax
paths:
  /v1/tax/event:
    post:
      tags:
      - Tax
      summary: Post Tax Event
      description: Classify a single transaction. Real on-chain reads. Inputs only — no advice.
      operationId: post_tax_event_v1_tax_event_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxEventBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Tax Event V1 Tax Event Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tax/bulk:
    post:
      tags:
      - Tax
      summary: Post Tax Bulk
      description: Classify an array of transactions in a single call (max 50).
      operationId: post_tax_bulk_v1_tax_bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxBulkBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Tax Bulk V1 Tax Bulk Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tax/today:
    get:
      tags:
      - Tax
      summary: Get Tax Today
      description: Count of taxable-classified events seen in the last 24h, by event type.
      operationId: get_tax_today_v1_tax_today_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Tax Today V1 Tax Today Get
  /v1/tax/health:
    get:
      tags:
      - Tax
      summary: Get Tax Health
      operationId: get_tax_health_v1_tax_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Tax Health V1 Tax Health Get
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TaxBulkBody:
      properties:
        tx_hashes:
          items:
            type: string
          type: array
          title: Tx Hashes
          description: Array of transaction hashes/signatures
        chain:
          type: string
          title: Chain
          description: base | ethereum | solana
      type: object
      required:
      - tx_hashes
      - chain
      title: TaxBulkBody
    TaxEventBody:
      properties:
        tx_hash:
          type: string
          title: Tx Hash
          description: Transaction hash (EVM) or signature (Solana)
        chain:
          type: string
          title: Chain
          description: base | ethereum | solana
      type: object
      required:
      - tx_hash
      - chain
      title: TaxEventBody
