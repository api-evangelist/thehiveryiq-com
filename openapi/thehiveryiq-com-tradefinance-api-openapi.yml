    post:
      tags:
      - tradefinance
      summary: List Tradefinance
      operationId: list_tradefinance_v1_tradefinance_template_list_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Tradefinance V1 Tradefinance Template List Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/agents:
    get:
      tags:
