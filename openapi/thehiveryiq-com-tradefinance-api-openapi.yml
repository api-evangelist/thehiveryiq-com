                additionalProperties: true
                type: object
                title: Response Get Template V1 Tradefinance Template Get
  /v1/tradefinance/contract:
    post:
      tags:
      - tradefinance
      summary: Post Contract
      operationId: post_contract_v1_tradefinance_contract_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hivemorph__hive_tradefinance__routes__ContractBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Contract V1 Tradefinance Contract Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/contract/{contract_id}:
    get:
      tags:
      - tradefinance
      summary: Get Contract Detail
      operationId: get_contract_detail_v1_tradefinance_contract__contract_id__get
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          title: Contract Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Contract Detail V1 Tradefinance Contract  Contract Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/fund:
    post:
      tags:
      - tradefinance
      summary: Post Fund
      operationId: post_fund_v1_tradefinance_fund_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Fund V1 Tradefinance Fund Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/milestone-tick:
    post:
      tags:
      - tradefinance
      summary: Post Milestone
      operationId: post_milestone_v1_tradefinance_milestone_tick_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Milestone V1 Tradefinance Milestone Tick Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/escrow/{contract_id}:
    get:
      tags:
      - tradefinance
      summary: Get Escrow Detail
      operationId: get_escrow_detail_v1_tradefinance_escrow__contract_id__get
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          title: Contract Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Escrow Detail V1 Tradefinance Escrow  Contract Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/dispute:
    post:
      tags:
      - tradefinance
      summary: Post Dispute
      operationId: post_dispute_v1_tradefinance_dispute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hivemorph__hive_tradefinance__routes__DisputeBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Dispute V1 Tradefinance Dispute Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/webhook:
    post:
      tags:
      - tradefinance
      summary: Post Webhook
      description: 'Public tracking-event webhook. Accepts the canonical event shape

        (suitable for posting from webhook.site, Zapier, n8n, in-house ERP,

        or a freight forwarder TMS). FreightWaves SONAR / MarineTraffic AIS /

        GS1 EPCIS-shaped payloads are accepted as schema-compatible test

        targets — they are NOT integration partners.


        Routes:

        MILESTONE event → fire milestone on the escrow (and auto-settle if

        milestone == DELIVERED)

        EXCEPTION event → file dispute and resolve inline'
      operationId: post_webhook_v1_tradefinance_webhook_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Payload
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Post Webhook V1 Tradefinance Webhook Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tradefinance/dispute/{dispute_id}:
    get:
      tags:
