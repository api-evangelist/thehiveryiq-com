      operationId: economics_v1_tradefinance_economics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Economics V1 Tradefinance Economics Get
components:
  schemas:
    FundBody:
      properties:
        contract_id:
          type: string
          title: Contract Id
        funder_did:
          type: string
          title: Funder Did
      type: object
      required:
      - contract_id
      - funder_did
      title: FundBody
    hivemorph__hive_tradefinance__routes__ContractBody:
      properties:
        importer_did:
          type: string
          title: Importer Did
        exporter_did:
          type: string
          title: Exporter Did
        freight_forwarder_did:
          type: string
          title: Freight Forwarder Did
        bank_guarantor_did:
          anyOf:
          - type: string
          - type: 'null'
          title: Bank Guarantor Did
          default: ''
        origin_country:
          type: string
          maxLength: 2
          minLength: 2
          title: Origin Country
        destination_country:
          type: string
          maxLength: 2
          minLength: 2
          title: Destination Country
        incoterm:
          type: string
          title: Incoterm
        origin_port:
          type: string
          title: Origin Port
        destination_port:
          type: string
          title: Destination Port
        hs_code:
          type: string
          title: Hs Code
        goods_description:
          type: string
          title: Goods Description
        quantity:
          type: number
          exclusiveMinimum: 0.0
          title: Quantity
        unit:
          type: string
          title: Unit
        unit_value_usd:
          type: number
          minimum: 0.0
          title: Unit Value Usd
        total_value_usd:
          type: number
          exclusiveMinimum: 0.0
          title: Total Value Usd
        contract_value_usd:
          type: number
          exclusiveMinimum: 0.0
          title: Contract Value Usd
        settle_currency:
          type: string
          title: Settle Currency
          default: USDC
        settle_chain:
          type: string
          title: Settle Chain
          default: base
        payment_schedule:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Payment Schedule
        pickup_window_start:
          type: number
          title: Pickup Window Start
        pickup_window_end:
          type: number
          title: Pickup Window End
        delivery_window_start:
          type: number
          title: Delivery Window Start
        delivery_window_end:
          type: number
          title: Delivery Window End
        bond_amount_usdc:
          type: number
          minimum: 0.0
          title: Bond Amount Usdc
          default: 0.0
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - importer_did
      - exporter_did
      - freight_forwarder_did
      - origin_country
      - destination_country
      - incoterm
      - origin_port
      - destination_port
      - hs_code
      - goods_description
      - quantity
      - unit
      - unit_value_usd
      - total_value_usd
      - contract_value_usd
      - pickup_window_start
      - pickup_window_end
      - delivery_window_start
      - delivery_window_end
      title: ContractBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ListBody:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      title: ListBody
    MilestoneBody:
      properties:
        contract_id:
          type: string
          title: Contract Id
        milestone:
          type: string
          title: Milestone
        fired_by_did:
          type: string
          title: Fired By Did
          default: ''
        evidence:
          additionalProperties: true
          type: object
          title: Evidence
      type: object
      required:
      - contract_id
      - milestone
      title: MilestoneBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    hivemorph__hive_tradefinance__routes__DisputeBody:
      properties:
        dispute_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dispute Id
        contract_id:
          type: string
          title: Contract Id
        dispute_condition:
          type: string
          title: Dispute Condition
        filer_did:
          type: string
          title: Filer Did
        evidence:
          additionalProperties: true
          type: object
          title: Evidence
      type: object
      required:
      - contract_id
      - dispute_condition
      - filer_did
      title: DisputeBody
