openapi: 3.2.0
info:
  title: HiveMorph v0.1 Nanopay API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: nanopay
paths:
  /v1/nanopay/bench:
    get:
      tags:
      - nanopay
      summary: Live nanopay benchmark — receipts/sec, $/receipt, PQ coverage, rails
      description: 'Public, free, real-time benchmark of Hive Nanopay rails.

        No auth. Pulls real values from the receipts ledger + x402 stats.'
      operationId: nanopay_bench_v1_nanopay_bench_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Nanopay Bench V1 Nanopay Bench Get
  /v1/nanopay/standard:
    get:
      tags:
      - nanopay
      summary: Hive Nanopay spec metadata — version, repo, x402 PR, reference impl
      operationId: nanopay_standard_v1_nanopay_standard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Nanopay Standard V1 Nanopay Standard Get
  /v1/nanopay/cross-rail:
    post:
      tags:
      - nanopay
      summary: Issue a cross-rail nanopay receipt verifiable on Base + Solana + Ethereum
      description: 'Single receipt envelope containing rail-specific proofs for multiple chains.

        Demo + production endpoint. Free.'
      operationId: nanopay_cross_rail_v1_nanopay_cross_rail_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Nanopay Cross Rail V1 Nanopay Cross Rail Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/nanopay/cross-rail/verify:
    post:
      tags:
      - nanopay
      summary: Verify a cross-rail nanopay receipt (deterministic)
      description: Deterministic verify of a cross-rail receipt envelope. Free.
      operationId: nanopay_cross_rail_verify_v1_nanopay_cross_rail_verify_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Nanopay Cross Rail Verify V1 Nanopay Cross Rail Verify Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
