openapi: 3.2.0
info:
  title: HiveMorph v0.1 Nanoverse API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: nanoverse
paths:
  /v1/nanoverse/api-pay-per-call/info:
    get:
      tags:
      - nanoverse
      summary: NanoVerse info — API-PAY-PER-CALL
      description: Free — returns nanoagent metadata, primitives, pricing tier, TAM, and spec links.
      operationId: _info_handler_v1_nanoverse_api_pay_per_call_info_get
      parameters:
      - name: slug
        in: query
        required: false
        schema:
          default: api-pay-per-call
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response  Info Handler V1 Nanoverse Api Pay Per Call Info Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/nanoverse/api-pay-per-call/quote:
    post:
      tags:
      - nanoverse
      summary: NanoVerse quote — API-PAY-PER-CALL
