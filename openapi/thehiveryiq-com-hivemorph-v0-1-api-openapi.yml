openapi: 3.2.0
info:
  title: HiveMorph V0.1 API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: HiveMorph V0.1
paths:
  /:
    get:
      summary: Service descriptor (content-negotiated)
      description: 'Content-negotiated root. Accept: application/json (or agent/MCP/curl User-Agent, or no Accept header) returns the JSON service descriptor. Accept: text/html (or browser User-Agent) returns the HTML landing page with Organization + 22 SoftwareApplication JSON-LD entries.'
      operationId: root__get
      responses:
        '200':
          description: Service descriptor (JSON) or landing page (HTML).
          content:
            application/json:
              schema: {}
            text/html: {}
      tags:
      - HiveMorph V0.1
