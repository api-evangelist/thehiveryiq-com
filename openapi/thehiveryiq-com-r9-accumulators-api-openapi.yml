        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/accumulator/{domain}/inclusion:
    get:
      tags:
      - r9-accumulators
      summary: Accumulator Inclusion
      operationId: accumulator_inclusion_v1_accumulator__domain__inclusion_get
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Domain
      - name: key
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/accumulator/{domain}/non-membership:
    get:
      tags:
      - r9-accumulators
      summary: Accumulator Non Membership
      operationId: accumulator_non_membership_v1_accumulator__domain__non_membership_get
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Domain
      - name: key
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
