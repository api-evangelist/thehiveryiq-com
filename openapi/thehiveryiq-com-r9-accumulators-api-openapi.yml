info:
  title: Thehiveryiq Com R9 Accumulators API
  version: 0.1.0
  description: 'Operations tagged r9-accumulators across 2 of this provider''s published API definitions: thehiveryiq-com-hivemorph-openapi.json, thehiveryiq-com-hivemorph-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://receipts.thehiveryiq.com
  description: 'Production. The document is served from this host at /openapi.json and the provider''s own llms.txt on the same host states ''Base URL: https://receipts.thehiveryiq.com''; the original document declares no servers[] (added by API Evangelist, see overlays/).'
tags:
- name: r9-accumulators
paths:
  /v1/accumulator/policy:
    get:
      tags:
      - r9-accumulators
      summary: Accumulator Policy
      operationId: accumulator_policy_v1_accumulator_policy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/accumulator/anchor:
    post:
      tags:
      - r9-accumulators
      summary: Accumulator Anchor
      operationId: accumulator_anchor_v1_accumulator_anchor_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnchorReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/accumulator/{domain}/root:
    get:
      tags:
      - r9-accumulators
      summary: Accumulator Root
      operationId: accumulator_root_v1_accumulator__domain__root_get
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Domain
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/accumulator/{domain}/leaves:
    get:
      tags:
      - r9-accumulators
      summary: Accumulator Leaves
      operationId: accumulator_leaves_v1_accumulator__domain__leaves_get
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Domain
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/accumulator/{domain}/replay:
    get:
      tags:
      - r9-accumulators
      summary: Accumulator Replay
      operationId: accumulator_replay_v1_accumulator__domain__replay_get
      parameters:
      - name: domain
        in: path
        required: true
        schema:
