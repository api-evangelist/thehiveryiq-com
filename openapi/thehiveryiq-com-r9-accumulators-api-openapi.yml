  /v1/accumulator/verify:
    post:
      tags:
      - r9-accumulators
      summary: Accumulator Verify
      operationId: accumulator_verify_v1_accumulator_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hivemorph__hive_r9__routes__VerifyReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    hivemorph__hive_r9__routes__VerifyReq:
      properties:
        witness:
          additionalProperties: true
          type: object
          title: Witness
          description: An inclusion witness as returned by /inclusion
      type: object
      required:
      - witness
      title: VerifyReq
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AnchorReq:
      properties:
        domain:
          type: string
          maxLength: 64
          minLength: 1
          title: Domain
        key:
          type: string
          maxLength: 256
          minLength: 1
          title: Key
        value:
          additionalProperties: true
          type: object
          title: Value
        anchored_by:
          type: string
          maxLength: 200
          minLength: 3
          title: Anchored By
        note:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Note
      type: object
      required:
      - domain
      - key
      - anchored_by
      title: AnchorReq
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
