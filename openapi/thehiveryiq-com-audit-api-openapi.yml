openapi: 3.2.0
info:
  title: HiveMorph v0.1 Audit API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: Audit
paths:
  /v1/audit/readiness:
    post:
      tags:
      - Audit
      summary: Readiness
      operationId: readiness_v1_audit_readiness_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadinessRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ReadinessRequest:
      properties:
        organization_country:
          type: string
          maxLength: 2
          minLength: 2
          title: Organization Country
        users_in_eu:
          type: boolean
          title: Users In Eu
          default: false
        users_in_california:
          type: boolean
          title: Users In California
          default: false
        users_in_colorado:
          type: boolean
          title: Users In Colorado
          default: false
        users_in_uk:
          type: boolean
          title: Users In Uk
          default: false
        ai_use_categories:
          items:
            type: string
          type: array
          title: Ai Use Categories
        monthly_inference_calls:
          type: integer
          maximum: 10000000000.0
          minimum: 0.0
          title: Monthly Inference Calls
        data_categories_processed:
          items:
            type: string
          type: array
          title: Data Categories Processed
        currently_logging:
          type: boolean
          title: Currently Logging
          default: false
        logging_method:
          type: string
          enum:
          - application_log
          - siem
          - none
          - other
          title: Logging Method
          default: none
        is_federal_agency:
          type: boolean
          title: Is Federal Agency
          default: false
        annual_revenue_usd:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Annual Revenue Usd
      type: object
      required:
      - organization_country
      - monthly_inference_calls
      title: ReadinessRequest
