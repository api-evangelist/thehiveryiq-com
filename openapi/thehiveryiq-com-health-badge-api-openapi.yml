openapi: 3.2.0
info:
  title: HiveMorph v0.1 Health Badge API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: health-badge
paths:
  /v1/badge:
    get:
      tags:
      - health-badge
      summary: Get Badge
      description: 'SVG health badge: $/day, agents online, progress toward $1,285/day target.

        Safe for or embed. Hive Gold #C08D23 (Pantone 1245 C).'
      operationId: get_badge_v1_badge_get
      parameters:
      - name: style
        in: query
        required: false
        schema:
          type: string
          description: full | compact | mini
          default: full
          title: Style
        description: full | compact | mini
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
