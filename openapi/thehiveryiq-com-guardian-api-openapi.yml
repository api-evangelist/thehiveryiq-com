openapi: 3.2.0
info:
  title: HiveMorph v0.1 Guardian API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: Guardian
paths:
  /v1/guardian/health:
    get:
      tags:
      - Guardian
      summary: Health
      operationId: health_v1_guardian_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health V1 Guardian Health Get
  /v1/guardian/scores:
    get:
      tags:
      - Guardian
      summary: Scores
      description: Per-axis quality scores from the AIMEW QualityScorer.
      operationId: scores_v1_guardian_scores_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Scores V1 Guardian Scores Get
  /v1/guardian/weights:
    get:
      tags:
      - Guardian
      summary: Weights
      description: Current AIMEW weight vector. Σ w_i = 1.0 across non-excluded axes.
      operationId: weights_v1_guardian_weights_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Weights V1 Guardian Weights Get
  /v1/guardian/anomalies:
    get:
      tags:
      - Guardian
      summary: Anomalies
      description: Per-axis anomaly score from the LSTM detector + quarantine list.
      operationId: anomalies_v1_guardian_anomalies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Anomalies V1 Guardian Anomalies Get
