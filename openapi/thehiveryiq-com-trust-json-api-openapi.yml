paths:
  /trust.json:
    get:
      summary: Hive trust posture — signing, doctrine, attestation surfaces
      description: 'Public trust posture for partners, auditors, and procurement.


        Captures: brand identity, legal entity, signing keys + algorithms,

        crypto-agility status, attestation surfaces, vocabulary discipline,

        and the LIVE/PILOT/ROADMAP labels for every public layer.


        Locked spec section 14 (12 mandatory fields):

        issuer_did, verifier_keys, key_epoch, key_rotation_schedule,

        supported_receipt_weights, supported_proof_tiers, sample_receipts,

        transaction_harness_status, status_url, evidence_manifest_url,

        incident_log_url, external_audits.'
      operationId: trust_json_trust_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Trust.json
