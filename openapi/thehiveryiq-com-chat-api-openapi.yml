openapi: 3.2.0
info:
  title: HiveMorph v0.1 Chat API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: Chat
paths:
  /v1/chat/public:
    post:
      tags:
      - Chat
      summary: Chat Public
      operationId: chat_public_v1_chat_public_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPublicReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/public/health:
    get:
      tags:
      - Chat
      summary: Chat Public Health
      operationId: chat_public_health_v1_chat_public_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ChatPublicReq:
      properties:
        prompt:
          type: string
          maxLength: 2000
          minLength: 1
          title: Prompt
      type: object
      required:
      - prompt
      title: ChatPublicReq
