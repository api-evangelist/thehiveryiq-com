openapi: 3.2.0
info:
  title: HiveMorph v0.1 App Kits API
  description: 'Polymorphic agent runtime — single shape (Merchant), single supermodel (W2 MERCHANT). Three gates: NEED + YIELD + CLEAN-MONEY.'
  version: 0.1.0
tags:
- name: app-kits
paths:
  /v1/appkits:
    get:
      tags:
      - app-kits
      summary: Appkits Capabilities
      description: Capability discovery. Compare to Circle App Kits surface.
      operationId: appkits_capabilities_v1_appkits_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Appkits Capabilities V1 Appkits Get
  /v1/appkits/quote:
    post:
      tags:
      - app-kits
      summary: Appkits Quote
      operationId: appkits_quote_v1_appkits_quote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hivemorph__appkits_routes__QuoteBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Appkits Quote V1 Appkits Quote Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/appkits/bridge:
    post:
      tags:
      - app-kits
      summary: Appkits Bridge
      operationId: appkits_bridge_v1_appkits_bridge_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Appkits Bridge V1 Appkits Bridge Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/appkits/send:
    post:
      tags:
      - app-kits
      summary: Appkits Send
      operationId: appkits_send_v1_appkits_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Appkits Send V1 Appkits Send Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/appkits/swap:
    post:
      tags:
      - app-kits
      summary: Appkits Swap
      operationId: appkits_swap_v1_appkits_swap_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Appkits Swap V1 Appkits Swap Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/appkits/balance/{address}:
    get:
      tags:
      - app-kits
      summary: Appkits Unified Balance
      description: 'Returns a unified balance across every supported chain.

        v0.1 emits a deterministic empty-skeleton response so clients can wire UI

        today; live indexer will populate by_chain in v0.2.'
      operationId: appkits_unified_balance_v1_appkits_balance__address__get
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          title: Address
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Appkits Unified Balance V1 Appkits Balance  Address  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    hivemorph__appkits_routes__QuoteBody:
      properties:
        amount:
          type: number
          exclusiveMinimum: 0.0
          title: Amount
        token_in:
          type: string
          title: Token In
        token_out:
          type: string
          title: Token Out
        chain_from:
          type: string
          title: Chain From
        chain_to:
          type: string
          title: Chain To
      type: object
      required:
      - amount
      - token_in
      - token_out
      - chain_from
      - chain_to
      title: QuoteBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BridgeBody:
      properties:
        amount:
          type: number
          exclusiveMinimum: 0.0
          title: Amount
        token:
          type: string
          title: Token
        from_chain:
          type: string
          title: From Chain
        to_chain:
          type: string
          title: To Chain
        to_address:
          type: string
          title: To Address
      type: object
      required:
      - amount
      - token
      - from_chain
      - to_chain
      - to_address
      title: BridgeBody
    SendBody:
      properties:
        amount:
          type: number
          exclusiveMinimum: 0.0
          title: Amount
        token:
          type: string
          title: Token
        chain:
          type: string
          title: Chain
        to:
          type: string
          title: To
      type: object
      required:
      - amount
      - token
      - chain
      - to
      title: SendBody
    SwapBody:
      properties:
        amount:
          type: number
          exclusiveMinimum: 0.0
          title: Amount
        token_in:
          type: string
          title: Token In
        token_out:
          type: string
          title: Token Out
        chain:
          type: string
          title: Chain
      type: object
      required:
      - amount
      - token_in
      - token_out
      - chain
      title: SwapBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
