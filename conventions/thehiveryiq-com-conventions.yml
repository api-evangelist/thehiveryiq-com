request_id_tracing:
  request_header: X-Hive-Request-Id (declared on POST /v1/earn/register only)
  response_headers:
  - X-Hive-Prov-Iss
  - X-Hive-Prov-Ts
  - X-Hive-Prov-Sig
  - X-Hive-Prov-Pubkey
  - X-Hive-Prov-Payload
  note: api.thehiveryiq.com signs every response (Ed25519 over "METHOD path body-hash ts") and exposes the headers
    via access-control-expose-headers; the verification key is at /v1/prov/pubkey. Receipts responses carry a receipt_id
    that doubles as the trace handle.
