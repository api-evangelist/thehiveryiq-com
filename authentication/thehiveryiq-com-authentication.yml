response_provenance:
  note: 'Authentication of the SERVER to the client is a first-class feature: api.thehiveryiq.com signs every response
    (X-Hive-Prov-Iss did:hive:hivecompute, X-Hive-Prov-Ts, X-Hive-Prov-Sig, X-Hive-Prov-Pubkey -> /v1/prov/pubkey,
    X-Hive-Prov-Payload) and publishes a JWKS; receipts.thehiveryiq.com publishes its Ed25519 verifier key at /v1/prov/pubkey
    and /trust.json (issuer did:hive:hivemorph, epoch 1, rotation "on-incident or annual"); passport.thehiveryiq.com
    does the same for did:hive:hive-passport.'
  observed: Response headers on GET https://api.thehiveryiq.com/openapi.json, 2026-09-19
gaps:
- No securitySchemes in either OpenAPI, so generated clients cannot attach credentials or model the 402 flow.
- No OAuth 2.0 / OIDC anywhere (RFC 8414 / 9728 / OIDC discovery all absent on every host, including both MCP hosts).
- 'Key lifecycle: no documented rotation for tenant keys; the security page states "no verified 90-day automatic
  invalidation policy".'
