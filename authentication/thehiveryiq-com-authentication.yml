- name: x402
  type: payment-challenge
  protocol: x402
  applies_to: Every metered operation (receipt emit, rubric select, prospector score, rosetta normalize after the
    first 25 free calls per agent, compute.chat, most gateway MCP tools)
  challenge:
    status: 402
    receipts_host:
      headers:
        x-payment-required: 'true'
      body: '{"error":"payment_required","message":"This endpoint requires a micropayment via the x402 protocol.
        Submit payment proof via X-Payment header or POST /v1/x402/proof/submit.","payment":{"x402_version":"0.1","nonce":"<uuid>","resource":"/v1/receipt/emit","amount_usd":0.0008,"payment_endpoint":"/v1/x402/proof/submit","expires_at":<unix>,"accepts":[{"chain":"base","asset":"USDC","scheme":"exact","recipient":"0x15184bf5...436e","asset_contract":"0x833589fC...02913","decimals":6,"amount_atomic":"800"},
        ...USDT/base, USDC+USDT/solana, USDT/ethereum]}}'
      observed: POST /v1/receipt/emit without payment, 2026-09-19
    hivecompute_host:
      headers:
        www-authenticate: x402
        payment-required: '<base64url JSON: {"x402Version":1,"accepts":[{"scheme":"exact","network":"base","maxAmountRequired":"20000","resource":"https://api.thehiveryiq.com/v1/compute/chat/completions","payTo":"0x15184Bf5...436E","maxTimeoutSeconds":300,"asset":"0x833589fC...02913","extra":{"name":"USD
          Coin","version":"2","assetTransferMethod":"eip3009"}}]}>'
      observed: POST /v1/compute/chat/completions without payment, 2026-09-19
      note: 'The two hosts speak two different x402 envelope generations (x402_version 0.1 JSON body vs x402Version
        1 base64 PAYMENT-REQUIRED header + www-authenticate: x402).'
  settlement:
    submit: 'POST /v1/x402/proof/submit (operationId submit_proof_v1_x402_proof_submit_post): "Submit a payment
      proof for a pending 402 nonce. On success, returns an access token (5-minute TTL) that can be used in the
      X-Hive-Access header to bypass 402 for the same path."'
    header_alternative: X-Payment header carrying the proof
    rails: 'https://receipts.thehiveryiq.com/v1/x402/rails and /.well-known/x402.json: USDC + USDT on Base (8453),
      USDC + USDT on Solana, USDT on Ethereum; scheme exact; EIP-3009 transferWithAuthorization on Base'
    client_sdk: hive-rosetta (npm/PyPI 0.1.0) implements the 402 -> sign -> retry loop
  sources:
  - openapi/thehiveryiq-com-hivemorph-openapi.yml
