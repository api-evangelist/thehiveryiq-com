- aid: thehiveryiq-com:hive-passport-trust-rail
  name: Hive Passport Trust Rail (HKTN)
  description: 'The trust rail on passport.thehiveryiq.com: HKTN (Hive Known Traveler Number) registry for persistent
    agent identity and tier, tenant onboarding and dashboards, provenance public-key distribution and offline verification,
    and the signed probe ledger the apex status page renders. No OpenAPI is served (/openapi.json is a real 404);
    the surface map is the host llms.txt, which lists the key endpoints.'
  humanURL: https://thehiveryiq.com/agents
