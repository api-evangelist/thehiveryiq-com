aid: thehiveryiq-com
name: Hive Civilization
description: 'Hive Civilization (DBAs The Hivery and The Hivery IQ; Walnut Creek, California; single-founder Wyoming
  corporation established 2026) sells signed, independently verifiable receipts for automated and AI-agent actions:
  every call returns a dual-signed record (Ed25519 plus ML-DSA-65) over an artifact hash, priced per receipt and
  settled per call in USDC on Base through the x402 payment protocol, with no account required for the free tier.
  The public surface is spread over four hosts: receipts.thehiveryiq.com serves the HiveMorph receipts and agent-commerce
  API (a 906-path, 937-operation FastAPI OpenAPI 3.1 contract covering receipt emit/verify, x402 quotes and settlement
  references, delegations and a firewall, HKTN trust lookups, plus dozens of vertical attestation families), a JSON-RPC
  2.0 agent endpoint and A2A agent cards; api.thehiveryiq.com serves HiveCompute, an OpenAI-compatible, x402-metered
  inference router with a live remote MCP server; passport.thehiveryiq.com is the HKTN trust rail; and hive-mcp-gateway.onrender.com
  fronts 37 hive-mcp-* MCP servers. The apex publishes an A2A agent card, security.txt, llms.txt, pricing, a self-attested
  (uncertified) SOC 2 / ISO 27001 posture and a did:hive DID method specification.'
