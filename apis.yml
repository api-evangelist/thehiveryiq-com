apis:
- aid: thehiveryiq-com:hivemorph-receipts-api
  name: Hive Receipts and Agent Commerce API (HiveMorph)
  description: 'Pay-per-call REST API on receipts.thehiveryiq.com for signing and verifying receipts (free tier:
    100 dual-signed receipts per IP per day with no key; paid profiles nano/standard/pq at $0.0001/$0.0008/$0.0012
    per call), x402 quotes, multi-rail settlement references (USDC/USDT on Base, Solana, Ethereum), delegation envelopes
    and firewall previews, HKTN trust lookups, intent normalization and scoring, and a long tail of vertical attestation
    families (HIPAA, ALCOA, LEX-Contract, DeedLock, ProcureLock, TradeGuard, evaluator, trade finance, disputes,
    morph runtime). 937 operations across 906 paths, OpenAPI 3.1.0 (FastAPI) at https://receipts.thehiveryiq.com/openapi.json
    with Swagger UI at /docs; the document declares no servers[] and no securitySchemes.'
  humanURL: https://thehiveryiq.com/developers
