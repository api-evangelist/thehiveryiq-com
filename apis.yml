- aid: thehiveryiq-com:hive-a2a-agent
  name: Hive Civilization A2A Agent
  description: >-
    Agent-to-agent surface: A2A agent cards on the apex (protocolVersion 0.3.0, six HiveAttest/HiveWallet/HiveGate
    skills) and on receipts.thehiveryiq.com (0.2.0 catalog of ten per-agent cards with the AP2 x402 payment
    extension), and a JSON-RPC 2.0 endpoint at https://receipts.thehiveryiq.com/a2a exposing 49 proprietary
    methods (agent.card, receipt.emit, x402.quote, delegation.*, firewall.*, hktn.*). The endpoint does
    not implement A2A's message/send or tasks/get.
  humanURL: https://thehiveryiq.com/a2a/
  baseURL: https://receipts.thehiveryiq.com/a2a
