- aid: thehiveryiq-com:hivecompute-inference-api
  name: HiveCompute Inference Router API
  description: 'OpenAI-compatible inference router on api.thehiveryiq.com: chat completions, text completions and
    embeddings across 447 models drawn live from the OpenRouter registry, with automatic context compression and
    cheapest-adequate-model routing, priced per token in USDC and settled through x402 (a live 402 challenge with
    www-authenticate: x402 and a PAYMENT-REQUIRED header was observed). Free endpoints: model list and cost estimate.
    The served OpenAPI is a 5-path 3.0.3 stub without operationIds; the host signs every response with Ed25519 provenance
    headers and publishes a JWKS, but also answers HTTP 200 JSON for every unknown path.'
  humanURL: https://thehiveryiq.com/sdk-quickstart/
