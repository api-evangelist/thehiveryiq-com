  name: Hive MCP Gateway and Registry
  description: 'Provider-operated remote MCP gateway on Render (named as the MCP transport by receipts.thehiveryiq.com/.well-known/mcp.json):
    initialize and tools/list answer anonymously with 38 tools from eight mounted servers (evaluator, trade, depin,
    compute-grid, morph, insurance-broker, dispute, audit-readiness) and a /.well-known/mcp.json registry of 37
    hive-mcp-* shim servers, each on its own host, all metered per call in USDC on Base with the first call free.'
