        provider_category:
          type: string
          description: storage | compute | gpu | bandwidth | energy | sensor | wireless
        unit_rate_usdc:
          type: number
          description: Price per unit in USDC
        unit_label:
          type: string
          description: Pricing unit, e.g. 'per TB-month', 'per GPU-hour'
        operator_did:
          type: string
          description: Operator DID for trust scoring
        payout_address:
          type: string
          description: Settlement address
        region:
          type: string
          description: Geographic region
        capacity_gb:
          type: number
          description: Capacity for storage providers (GB)
        throughput_mbps:
          type: number
          description: Throughput for bandwidth providers (Mbps)
        gpu_model:
          type: string
          description: GPU model for GPU providers
        vram_gb:
          type: number
          description: VRAM for GPU providers (GB)
        kind:
          type: string
          description: 'Listing kind (default: depin_provider)'
    annotations: null
  - name: depin__depin_get_match_fee
    description: Get the current DePIN marketplace match fee (currently 0.15%). Returned alongside settlement currencies
      and chains.
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: compute-grid__computegrid_list_agents
    description: List the 15-agent compute grid fleet across all 6 driver types. Returns agent type, count, and
      revenue model. No auth required.
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: compute-grid__computegrid_get_capacity
    description: 'Read-only capacity view from the Capacity Listener fleet. Per spec section 8: NO bids, NO hedges,
      NO positions, NO derivatives — pure read-only telemetry.'
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: compute-grid__computegrid_verify_proof
    description: Submit a compute job for verification by the Verification Fleet (4 agents). Returns Groth16-style
      proof. $0.001/proof in USDC.
    input_schema:
      type: object
      required:
      - job_id
      - driver
      - claimed_output_hash
      - submitter_did
      properties:
        job_id:
          type: string
          description: Job ID to verify
        driver:
          type: string
          description: 'Source driver: ionet | render | akash | aleo | custom'
        claimed_output_hash:
          type: string
          description: SHA-256 of claimed output
        submitter_did:
          type: string
          description: DID of the submitting agent
    annotations: null
  - name: morph__morph_audit_recent
    description: 'Read recent rows from the polymorphic audit log: outcome, shape, counterparty hash, token id,
