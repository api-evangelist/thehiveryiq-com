    input_schema:
      type: object
      properties:
        limit:
          type: number
          description: Max rows to return (default 50, max 500)
    annotations: null
  - name: morph__morph_get_identity
    description: 'Look up a Morph Identity Index (MII) record. Returns the polymorphic envelope: capabilities, current
