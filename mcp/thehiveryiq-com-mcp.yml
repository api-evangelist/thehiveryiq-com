  tools:
  - name: evaluator__evaluator_get_fees
    description: Get the live evaluator fee schedule (3 tiers, settlement currencies, recipient addresses, ERC-8183
      / Virtuals ACP v2.0 spec). No auth required.
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: evaluator__evaluator_submit_job
    description: Submit a job for evaluation. Choose tier (simple, evaluation, arbitration). Job value is quoted
      in USDC; fee = max($0.05, value * tier_bps / 10000). Returns job_id and quoted fee.
    input_schema:
      type: object
      required:
      - tier
      - job_value_usdc
      - subject_did
      - submitter_did
      properties:
        tier:
          type: string
          description: '''simple'' (0.5%), ''evaluation'' (1.0%), or ''arbitration'' (2.0%)'
        job_value_usdc:
          type: number
          description: Notional job value in USDC
        subject_did:
          type: string
          description: DID of the agent or output being evaluated
        submitter_did:
          type: string
          description: DID of the submitting agent
        context:
          type: string
          description: Free-form context for the evaluator (max 4 KB)
    annotations: null
  - name: evaluator__evaluator_get_job
    description: Retrieve evaluation status, verdict, and attestation for a previously-submitted job.
    input_schema:
      type: object
      required:
      - job_id
      properties:
        job_id:
          type: string
          description: Job ID returned from evaluator_submit_job
    annotations: null
  - name: evaluator__evaluator_attest_job
    description: Trigger settlement and emit the on-chain attestation for a completed job. Settles to the Hive Safe
      Treasury on the chain selected at submission. Requires EIP-3009 signature for Base/Ethereum.
    input_schema:
      type: object
      required:
      - job_id
      properties:
        job_id:
          type: string
          description: Job ID returned from evaluator_submit_job
        signature:
          type: string
          description: EIP-3009 signature (required for EVM chains)
    annotations: null
  - name: trade__trade_get_fees
    description: Get the cross-border invoice fee schedule and SWIFT wire comparison (Hive vs. typical SMB wire
      fees, FX spreads, settlement times).
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: trade__trade_get_listing
    description: Get the public listing metadata (target user, fee schedule, settlement currencies/chains, cumulative
      volume, council origin).
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: trade__trade_create_invoice
    description: Create a cross-border invoice. Buyer (SMB) and supplier exchange DIDs; invoice amount + currency
      + chain selected at creation. Fee auto-computed from tier.
    input_schema:
      type: object
      required:
      - buyer_did
      - supplier_did
      - amount_usd
      - settle_currency
      - settle_chain
      - supplier_payout_address
      properties:
        buyer_did:
          type: string
          description: DID of the SMB buyer
        supplier_did:
          type: string
          description: DID of the overseas supplier
        amount_usd:
          type: number
          description: Invoice amount in USD (max $250,000 for MVP)
        settle_currency:
          type: string
          description: USDT or USDC
        settle_chain:
          type: string
          description: base, ethereum, or solana
        supplier_payout_address:
          type: string
          description: Supplier's receiving address on the chosen chain
        memo:
          type: string
          description: Free-form invoice memo (PO number, goods description)
    annotations: null
  - name: trade__trade_get_invoice
    description: Retrieve invoice status, settlement transaction hash, and dispute history.
    input_schema:
      type: object
      required:
      - invoice_id
      properties:
        invoice_id:
          type: string
          description: Invoice ID returned from trade_create_invoice
    annotations: null
  - name: trade__trade_dispute_invoice
    description: Open a dispute on an invoice. Routes to HiveLaw arbitration if buyer and supplier cannot resolve.
      Settlement is held in escrow until resolution.
    input_schema:
      type: object
      required:
      - invoice_id
      - claimant_did
      - reason
      properties:
        invoice_id:
          type: string
          description: Invoice ID
        claimant_did:
          type: string
          description: DID of the disputing party (buyer or supplier)
        reason:
          type: string
          description: Dispute reason
        evidence_url:
          type: string
          description: Optional URL to supporting documents
    annotations: null
  - name: depin__depin_list_providers
    description: List DePIN provider listings. Filter by category (storage, compute, gpu, bandwidth, energy, sensor,
