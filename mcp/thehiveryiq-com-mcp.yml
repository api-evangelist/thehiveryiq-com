method: probed
status: published
source: https://api.thehiveryiq.com/mcp
docs: https://thehiveryiq.com/agents
summary: 'Hive Civilization operates remote MCP servers on at least three surfaces. (1) https://api.thehiveryiq.com/mcp,
  the HiveCompute inference router on the provider''s own domain: initialize and tools/list answered anonymously
  (MCP 2024-11-05, serverInfo hivecompute 2.0.0) with 5 tools carrying real inputSchemas and annotations, plus 2
  prompts; resources/list returns -32601. (2) https://hive-mcp-gateway.onrender.com/mcp, the provider''s MCP gateway/registry
  (named as the transport by receipts.thehiveryiq.com/.well-known/mcp.json): initialize + tools/list answered anonymously
  (MCP 2024-11-05, hive-mcp-gateway 1.2.0) with 38 tools from 8 in-process mounts (evaluator, trade, depin, compute-grid,
  morph, insurance-broker, dispute, audit-readiness) and a /.well-known/mcp.json registry of 37 further hive-mcp-*
  shim servers, each on its own onrender.com host. (3) Sixteen MCP-over-HTTP endpoints declared inside the HiveMorph
  OpenAPI (/v1/receipt/mcp, /v1/mcp/hivecomply ...), not individually probed. Tool invocation is metered by x402
  (USDC on Base): tools/list is free, paid tools answer HTTP 402 until a payment header is presented. DIVERGENCE:
  the 12 tools receipts.thehiveryiq.com/.well-known/mcp.json advertises (hive_verify_receipt, hive_emit_receipt
  ...) are NOT what the gateway it names actually serves on tools/list; they are declared REST bindings, mapped
  in the crosswalk on that basis. Authorship is knowable from the anonymous tools/list: tool names (compute.chat,
  morph__morph_brood_all, dispute__dispute_route) are Hive-specific and match no shared platform fingerprint; the
  gateway source is public at github.com/srotzin/hive-mcp-gateway.'
deployment:
  mode: remote
  endpoint: https://api.thehiveryiq.com/mcp
  auth: none
  verified: probed
  note: 'Hosted HTTPS endpoints an MCP client POSTs to directly; both endpoints below answered initialize and tools/list
    live on 2026-09-19 with no credential. auth is none in the connection sense; per-call PAYMENT via x402 (HTTP
    402 + PAYMENT-REQUIRED / x-payment-required, USDC on Base 8453) gates the paid tools, which is an economic gate
    on invocation rather than an authentication scheme, and no OAuth metadata (RFC 8414/9728) is served on either
    MCP host. The provider also makes the SOURCE of 37 stdio-capable hive-mcp-* servers available on GitHub (github.com/srotzin),
    run locally with ''npm install'' then ''node gateway.js'' per the README, but ships no npm/PyPI package for
    any of them, so this is not recorded as local-stdio: a git clone is not an install command an agent can act
    on.'
servers:
