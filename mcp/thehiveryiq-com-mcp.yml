    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: morph__morph_brood_all
    description: List all brood variants across every supermodel. Useful for fleet-wide population scans.
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: morph__morph_brood_conversion_leaderboard
    description: Conversion leaderboard across all brood variants ranked by settle rate × revenue. Drives the auto-cull
      and auto-promote signals.
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: morph__morph_brood_for_supermodel
    description: List brood variants for a specific supermodel (e.g. MONROE / W1).
    input_schema:
      type: object
      required:
      - supermodel
      properties:
        supermodel:
          type: string
          description: Supermodel name or id
    annotations: null
  - name: morph__morph_spawn_monitor_scan
    description: 'Run the spawn-monitor scan: detect supermodels eligible for new brood spawns based on conversion
      gaps, opportunity surface, and saturation. READ-ONLY — does not actually spawn.'
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: morph__morph_money_flavor_probe
    description: 'Probe the money-flavor classifier on the most recent settlement window: asset class histogram,
      chain class histogram, flow class histogram, arb-high count, refused count, non-USDC share.'
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: morph__morph_money_flavor_stats
    description: 'Rolling aggregate money-flavor statistics (default 1 hour window): asset class, chain class, flow
      class distributions, plus arb/refused/non-USDC ratios. Drives the CLEAN-MONEY gate.'
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: morph__morph_auto_cull_scan
    description: 'Run the auto-cull dry-run scan: which brood variants the system would cull based on conversion
      floors, ROI thresholds, and saturation. READ-ONLY — does not actually cull.'
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: insurance-broker__insurance_products
    description: List all available coverage products across providers (Nexus Mutual, Sherlock, Risk Harbor, InsurAce).
      Returns provider, type, capacity, and current cost-of-coverage where the upstream exposes it. Real third-party
      listings — Hive is broker-only and does not underwrite.
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: insurance-broker__insurance_quote
    description: Route a quote request to one or all underwriters. Hive forwards the request to the underwriter's
      own quote endpoint and returns the response verbatim. Hive does NOT bind coverage, accept premium, or take
      custody.
    input_schema:
      type: object
      required:
      - protocol
      - cover_amount_usd
      - duration_days
      properties:
        protocol:
          type: string
          description: Protocol/product identifier (e.g. '2' for Nexus Mutual Aave v2, or the productId from /products)
        cover_amount_usd:
          type: number
          description: Notional coverage in USD
        duration_days:
          type: number
          description: Coverage duration in days (1–365)
        provider:
          type: string
          description: 'Provider key. If omitted, quote routes to all four providers. One of: nexus_mutual, sherlock,
            risk_harbor, insurace'
    annotations: null
  - name: insurance-broker__insurance_today
    description: '24-hour rollup: total listing count + top providers by capacity. Returns request count and quote
      count for the rolling window.'
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: dispute__dispute_check
    description: 'Given a counterparty address + chain, return public dispute history, active arbitration cases,
      and on-chain reversal-pattern flags. Sources: Kleros / UMA / Reality.eth subgraphs (with direct on-chain RPC
      fallback) plus Etherscan-family transaction scans. Observational only — Hive does NOT judge, freeze, or enforce.'
    input_schema:
      type: object
      required:
      - address
      - chain
      properties:
        address:
          type: string
          description: 0x-prefixed counterparty address (20 bytes)
        chain:
          type: string
          description: ethereum | base | arbitrum
    annotations: null
  - name: dispute__dispute_providers
    description: List available third-party arbitration protocols (Kleros, UMA Optimistic Oracle, Reality.eth) with
      current case load, intake URLs, and jurisdiction model. Hive is not one of them — Hive only surfaces signal.
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: dispute__dispute_route
    description: Given a case description, disputed amount in USD, and optional jurisdiction preference, return
      ranked arbitration provider options. NO automatic filing — Hive returns options + intake URLs only. The disputing
      party files directly with the chosen provider.
    input_schema:
      type: object
      required:
      - description
      - amount_usd
      properties:
        description:
          type: string
          description: Free-form case description (max 2000 chars)
        amount_usd:
          type: number
          description: Disputed amount in USD
        jurisdiction:
          type: string
          description: Optional preference (e.g. 'decentralized', 'optimistic', 'crowdsourced')
    annotations: null
  - name: dispute__dispute_today
    description: '24-hour rollup: flagged-counterparty count + top arbitration providers by active case load.'
    input_schema:
      type: object
      properties: {}
    annotations: null
  - name: audit-readiness__audit_readiness_score
    description: Compute a multi-jurisdictional AI compliance readiness score for an organization. Returns penalty
      exposure (EUR + USD), specific compliance gaps citing the regulation article, recommended audit tier (STARTER/STANDARD/ENTERPRISE/FEDERAL),
      and the nearest enforcement deadline. Penalty math sources EU AI Act Art 99, Colorado AI Act SB 24-205, CCPA,
      Cal SB 942, NYC LL 144, HIPAA. Free, no auth, rate-limited 10/IP/hr.
    input_schema:
      type: object
      required:
      - organization_country
      - jurisdictions
      - data_volume_records
      - agent_count
      - monthly_inference_calls
      - frameworks
      properties:
        organization_country:
          type: string
          description: ISO 3166-1 alpha-2 country code (e.g. "US", "DE", "FR", "GB").
        jurisdictions:
          type: array
          items:
            type: string
          description: 'Where the system operates: ["EU", "US-CO", "US-CA", "US-NY", ...]. Drives which regulations
            apply.'
        data_volume_records:
          type: integer
          description: Total records processed (drives CCPA / GDPR scoping).
        agent_count:
          type: integer
          description: Number of distinct AI agents in production.
        monthly_inference_calls:
          type: integer
          description: Inference call volume per month (drives tier selection).
        sectors:
          type: array
          items:
            type: string
          description: 'Industries: ["finance", "healthcare", "employment", "education", "lending", "insurance",
            "criminal_justice", "biometric", "critical_infrastructure"].'
        frameworks:
          type: array
          items:
            type: string
          description: 'Regulations to score: ["eu_ai_act", "co_ai_act", "ccpa", "ca_sb942", "nyc_ll144", "hipaa",
            "gdpr", "nist_ai_rmf"].'
        company:
          type: string
          description: Organization name (optional; populates the assessment record).
    annotations: null
  - name: audit-readiness__audit_get_tier_pricing
    description: 'Returns the four published HiveAudit tier prices and bracket thresholds: STARTER ($500, <$500K
      exposure), STANDARD ($1,500, <$5M), ENTERPRISE ($2,500, <$50M), FEDERAL ($7,500/yr, ≥$50M or federal agency).
      Inlined, no backend call.'
    input_schema:
      type: object
      properties: {}
    annotations: null
- id: hivemorph-manifest
  name: hivemorph
  endpoint: https://hive-mcp-gateway.onrender.com/mcp
  transport: streamable-http
  auth: none
  status: declared
  source: https://receipts.thehiveryiq.com/.well-known/mcp.json
  file: well-known/thehiveryiq-com-receipts-mcp.json
  note: Discovery manifest served by the receipts host. It names the gateway above as its transport, but the gateway's
    live tools/list does not contain these 12 tool names; each tool declares a REST endpoint on receipts.thehiveryiq.com,
    and those endpoints are real (11 of 12 bind to an operationId in the OpenAPI, see the crosswalk; hive_create_evidence_artifact
    is marked ROADMAP by the provider and has no operation).
  tools:
  - name: hive_verify_receipt
    description: Headline tool. free | x402_required:false. Verify a Hive-signed receipt against the canonical pubkey.
      Returns verified:true|false + receipt_tier + 8 next_best_actions on success / 3 remediation NBAs on failure
      (verifier-as-funnel).
    endpoint: https://receipts.thehiveryiq.com/v1/receipt/verify
    method: POST
    stage: LIVE
    x402_required: false
    price_tier: free
  - name: hive_quote_x402
    description: free | x402_required:false. Issue a signed x402 quote envelope (USDC base-8453, ERC-681 URI). Binds
      caller agent_did to the quoted profile and treasury. The quote itself is free to fetch; redemption against
      /v1/x402/redeem is paid.
    endpoint: https://receipts.thehiveryiq.com/v1/x402/quote
    method: POST
    stage: LIVE
    x402_required: false
    price_tier: free
  - name: hive_emit_receipt
    description: 'paid | x402_required:true (when HIVE_EMIT_GATED=true). Issue a signed Ed25519 receipt over an
      artifact (hash + DID + signature). Profiles: nano | standard | pq (PQ profile gated by regulated-tier delegation).
      Settle via /v1/x402/quote first.'
    endpoint: https://receipts.thehiveryiq.com/v1/receipt/emit
    method: POST
    stage: LIVE
    x402_required: true
    price_tier: paid
  - name: hive_settlement_reference
    description: free | x402_required:false. Build a deterministic ERC-681 USDC payment reference for a given amount
      on Base 8453.
    endpoint: https://receipts.thehiveryiq.com/v1/settlement/reference
    method: GET
    stage: LIVE
    x402_required: false
    price_tier: free
  - name: hive_check_delegation
    description: free | x402_required:false. Single-call sugar over /v1/delegation/verify + /v1/firewall/enforce/preview.
      Returns decision + next_best_actions.
    endpoint: https://receipts.thehiveryiq.com/v1/delegation/check
    method: POST
    stage: LIVE
    x402_required: false
    price_tier: free
  - name: hive_lookup_hktn
    description: free | x402_required:false. Resolve a Hive Transaction Network identifier (HKTN) by agent_did or
      hktn string. Returns reputation tier (Cold/Warm/Hot/Regulated).
    endpoint: https://receipts.thehiveryiq.com/v1/hktn/lookup
    method: GET
    stage: LIVE
    x402_required: false
    price_tier: free
  - name: hive_select_rubric
    description: paid | x402_required:true. Select the best settlement rail for an intent (Hive rubric mesh).
    endpoint: https://receipts.thehiveryiq.com/v1/rubric/select
    method: POST
    stage: LIVE
    x402_required: true
    price_tier: paid
  - name: hive_score_counterparty
    description: paid | x402_required:true. Score an agent intent for clarity, specificity, and readiness. Returns
      triage band.
    endpoint: https://receipts.thehiveryiq.com/v1/prospector/score
    method: POST
    stage: LIVE
    x402_required: true
    price_tier: paid
  - name: hive_normalize_intent
    description: paid | x402_required:true. Translate a free-form intent string to canonical Hive intent (verb,
      amount, asset, counterparty, rail).
    endpoint: https://receipts.thehiveryiq.com/v1/rosetta/normalize
    method: POST
    stage: LIVE
    x402_required: true
    price_tier: paid
  - name: hive_get_status
    description: free | x402_required:false. Public engine status — R1..R12 layer health, discovery URLs, synthetic
      p50/p95 SLO targets per surface, incident log, and Base 8453 settlement chain probe (treasury + USDC contract).
      Read-only.
    endpoint: https://receipts.thehiveryiq.com/status.json
    method: GET
    stage: LIVE
    x402_required: false
    price_tier: free
  - name: hive_get_pricing
    description: free | x402_required:false. Receipt-profile pricing surface (nano/standard/pq) with HKTN tier discount
      metadata. Read-only.
    endpoint: https://receipts.thehiveryiq.com/pricing.json
    method: GET
    stage: LIVE
    x402_required: false
    price_tier: free
  - name: hive_create_evidence_artifact
    description: roadmap | x402_required:true (when LIVE). Sealed-evidence room artifact creation. Design surfaces
      present today; sealed-evidence write path on roadmap.
    endpoint: https://receipts.thehiveryiq.com/v1/evidence/artifact
    method: POST
    stage: ROADMAP
    x402_required: true
    price_tier: paid
